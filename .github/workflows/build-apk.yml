name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Krys Audition – Mon Parcours Auditif (v1.0.1 - Accès Protégé)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version Sécurisée)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Accès Restreint & Confidentiel :
            L'accès à l'application est protégé par un code de sécurité confidentiel afin de réserver l'évaluation aux professionnels et partenaires autorisés.
            - **Code d'accès par défaut :** `KRYS2026`

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.1.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.1/krys-audition-v1.0.1.apk)**
          files: |
            krys-audition-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
