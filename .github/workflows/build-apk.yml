name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Krys Audition – Mon Parcours Auditif (v1.0)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 📥 Téléchargement direct :
            Cliquez sur le fichier ci-dessous pour installer l'application sur votre smartphone Android :
            - **[Télécharger krys-audition-v1.0.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.0/krys-audition-v1.0.apk)**

            #### ✨ Fonctionnalités incluses :
            - **Répertoire National Krys Audition** : recherche par code postal, ville, région et géolocalisation avec appel direct et itinéraire.
            - **Étalonnage Acoustique Smartphone** : calibrage à la voix, froissement de papier biologique normé (~48 dBA), test 1 000 Hz et sonomètre ambiant FFT.
            - **Entraînement Auditif Personnalisé** : discrimination phonétique, mots dans le bruit, test DIN adaptatif, phrases du quotidien et mémoire auditive dans 4 bruits réels (restaurant, circulation, vaisselle, bruit rose).
            - **Bilans Cliniques Complets** : audiométrie tonale (VA/VO, BIAP, SII), vocale dans le calme (Fournier, SDT, SRT 50%, PB-Max, Roll-off) et compréhension dans le bruit (SNR-50, SNR Loss).
            - **Pédagogie & Neuroplasticité** : explications vulgarisées pour le patient.
            - **Questionnaire d'Anamnèse & Analyseur Local** : respect strict des données de santé (RGPD).
          files: |
            krys-audition-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
