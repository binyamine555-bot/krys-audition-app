name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Krys Audition – Mon Parcours Auditif (v1.0.8 - Synthèse Vocale Universelle Partout)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.8 - Voix Universelle HD)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 🎙️ Moteur de Synthèse Vocale Universel (Disponible 100% Partout) :
            - **Fin du message d'incompatibilité :** Le bandeau « La synthèse vocale n'est pas disponible sur ce navigateur » a été définitivement supprimé.
            - **Moteur Hybride Multi-Niveaux :**
              1. **Web Speech API native :** Utilisée en priorité lorsque le système d'exploitation la supporte.
              2. **Streaming Audio HD Français de secours :** Déclenchement automatique et instantané d'une voix française claire et fluide de studio en cas d'absence ou de blocage du moteur natif Android WebView.
              3. **Synthèse Phonétique Web Audio :** Filet de sécurité hors-ligne pour garantir qu'un son vocal soit toujours prononcé.
            - **Configuration Android Capacitor optimisée :** Autorisation complète des flux audio et requêtes média dans la WebView.

            #### 📍 Plus de 560 Centres & Espaces Krys en France (283 Centres + 283 Corners)
            #### 🎧 4 Ambiances Sonores Réalistes Distinctes (Restaurant, Circulation, Vaisselle, Salon)

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.8.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.8/krys-audition-v1.0.8.apk)**
          files: |
            krys-audition-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
