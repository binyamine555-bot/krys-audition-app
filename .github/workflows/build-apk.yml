name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Krys Audition – Mon Parcours Auditif (v1.0.4 - Clarté Vocale & Étalonnage Parole/Bruit)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.4 - Clarté Vocale Optimisée)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 🔊 Correctif Majeur sur la Clarté Vocale & la Parole dans le Bruit :
            - **Réduction du volume du bruit de fond de -25 dB :** Le bruit de fond (brouhaha, circulation, vaisselle) agissait précédemment à un niveau trop fort qui couvrait la voix sur les haut-parleurs mobiles. Il est désormais calibré comme une ambiance réaliste et douce en arrière-plan.
            - **Ducking acoustique automatique :** Lors de la prononciation du mot ou de la phrase, le bruit de fond est légèrement atténué en douceur pour détacher la parole avec une clarté optimale.
            - **Moteur vocal Android sécurisé :** Protection anti-coupure contre le ramasse-miettes (garbage collector) de Chromium et déblocage automatique de la synthèse vocale pour que chaque mot soit prononcé distinctement sans aucun silence.

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.4.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.4/krys-audition-v1.0.4.apk)**
          files: |
            krys-audition-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
