name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 109/g' android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "1.0.9"/g' android/app/build.gradle || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Sign & Prepare APK for Release
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -f "krys-release.keystore" ]; then
            $BUILD_TOOLS_DIR/apksigner sign --ks krys-release.keystore --ks-pass pass:KrysAudition2026 --out krys-audition-v1.0.9.apk android/app/build/outputs/apk/debug/app-debug.apk || cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.9.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.9.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.9.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Krys Audition – Mon Parcours Auditif (v1.0.9 - Voix Native Android & Calme Absolu)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.9 - Voix Native Opérationnelle)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 🗣️ Correctifs Majeurs sur la Parole & l'Entraînement :
            - **Intégration du moteur vocal natif Android :** Ajout du plugin officiel Capacitor Text-To-Speech qui communique directement avec le moteur vocal du système Android en français.
            - **Élimination du faux bruit de fond en mode calme :** Suppression complète du son parasite qui se déclenchait lors des essais. En mode calme (« Au calme »), aucun bruit ne retentit et la parole se détache dans un silence absolu.
            - **Pas de coupure prématurée :** Suppression des minuteurs de bascule qui interrompaient la voix avant qu'elle ne sorte sur les haut-parleurs.
            - **Mise à jour simplifiée sans conflit :** Signature cryptographique permanente et `versionCode 109` pour faciliter les futures mises à jour directes.

            #### 📍 Répertoire de plus de 560 Centres & Espaces Krys en France
            #### 🎧 Simulateur d'Ambiances Sonores Haute Fidélité (Restaurant, Circulation, Vaisselle, Salon)

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.9.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.9/krys-audition-v1.0.9.apk)**
          files: |
            krys-audition-v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
