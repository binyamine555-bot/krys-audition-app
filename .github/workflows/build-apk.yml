name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Krys Audition – Mon Parcours Auditif (v1.0.7 - Ambiances Sonores Haute Fidélité Réalistes)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.7 - Ambiances Réalistes HD)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 🎧 Refonte complète des 4 Ambiances Sonores Krys (Signatures Acoustiques Distinctes) :
            1. **Restaurant & Déjeuner animé :** Polyphonie vocale humaine réaliste (voix masculines et féminines murmurées avec intonations et cadences syllabiques) + bruits de verres et de salle feutrée.
            2. **Boulevard & Circulation urbaine :** Véhicules qui accélèrent et passent avec effet Doppler réaliste (frottement des pneus sur le bitume, montée et descente en fréquence) + grondement de moteur + léger klaxon lointain typiquement urbain.
            3. **Cuisine & Bruits de Vaisselle :** Écoulement de l'eau du robinet dans l'évier + chocs et tintements cristallins très nets d'assiettes en céramique, verres et couverts métalliques.
            4. **Salon & Souffle de Ventilation :** Souffle continu, doux, apaisant et régulier de climatisation / diffuseur d'air sans aucun choc ni voix.

            #### 📍 Répertoire exhaustif de plus de 560 Centres & Espaces en France
            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.7.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.7/krys-audition-v1.0.7.apk)**
          files: |
            krys-audition-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
