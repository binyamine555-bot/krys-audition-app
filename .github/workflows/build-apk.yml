name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Krys Audition – Mon Parcours Auditif (v1.0.6 - Correction Simulateur d'Ambiances Sonores)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.6 - Simulateur Sonore Actif)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 🔊 Correctif Majeur sur le Simulateur d'Ambiances Sonores Krys :
            - **Cycle de vie réparé :** Correction du routeur qui coupait instantanément le son lors du rafraîchissement du bouton de lecture. Le bouton passe désormais fidèlement en « Arrêter l'ambiance sonore » et les ondes audio s'animent en continu.
            - **Niveau d'ambiance calibré pour haut-parleur mobile :** Le volume des ambiances (Restaurant, Circulation, Vaisselle, Ventilation) est désormais clairement audible et réaliste lors de l'écoute immersive solo.
            - **Déverrouillage audio tactile :** Initialisation automatique du moteur Web Audio au premier contact de l'écran pour éviter toute mise en veille par le système Android.
            - **Ducking acoustique intelligent :** Lors de l'écoute d'une phrase test au milieu de l'ambiance sonore, le bruit s'atténue en douceur pour faire ressortir la voix avec une netteté clinique.

            #### 📍 Plus de 560 Centres & Espaces Krys en France :
            - Répertoire exhaustif métropole et outre-mer (283 centres exclusifs + 283 espaces audition).

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.6.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.6/krys-audition-v1.0.6.apk)**
          files: |
            krys-audition-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
