name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 112/g' android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "1.2.0"/g' android/app/build.gradle || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Sign & Prepare APK for Release
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -f "krys-release.keystore" ]; then
            $BUILD_TOOLS_DIR/apksigner sign --ks krys-release.keystore --ks-pass pass:KrysAudition2026 --out krys-audition-v1.2.0.apk android/app/build/outputs/apk/debug/app-debug.apk || cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.2.0.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.2.0.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Krys Optique & Audition (v1.2.0 - Showroom Vraies Lunettes & Rendu Réaliste)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition & Optique (Version 1.2.0 - Showroom Lunettes Haute Fidélité)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 👓 Révolution Graphique Optique & Showroom de Vraies Lunettes Krys :
            - **Rendu vectoriel réaliste haute définition :** Remplacement complet des anciens croquis filaires simplistes par des illustrations de vraies lunettes de créateurs avec biseaux acétate, branches en perspective 3D, charnières métalliques, plaquettes transparentes et reflets spéculaires obliques sur les verres.
            - **8 Montures Iconiques Krys modélisées :**
              - *Krys Signature Panthéon* (Pantos écaille d'Italie, Origine France Garantie)
              - *Krys Duo Tech Alvéole* (Titane mémoire, branches ultra-plates conçues pour zéro conflit avec les contours d'aides auditives)
              - *Krys Atelier Saint-Germain* (Ronde or champagne brossé 14g)
              - *Krys Urbaine Rivoli* (Carrée noire onyx avec verres protecteurs anti-lumière bleue)
              - *Krys Solaire Aéropostale* (Pilote aviateur double pont avec verres polarisés catégorie 3)
              - *Krys Élégance Concorde* (Papillon bordeaux / framboise rehausseur de regard)
              - *Krys Essentiel Vendôme* (Pantos cristal bio-acétate 100% Santé, 0€ de reste à charge)
              - *Krys Solaire Croisette* (Clubmaster browline rétro chic)
            - **Guide Clinique Duo « Lunettes & Aides Auditives » :** Conseils pratiques d'enfilage sans sifflement larsen ni frottement sur le microphone.
            - **Filtres interactifs par catégorie :** Tri instantané (Spécial Aides Auditives, Origine France Garantie, 100% Santé, Solaires).
            - **Design des médaillons (.ob-illu) :** Rénovation de l'ensemble des vignettes d'illustrations de l'application avec médaillons dégradés lumineux et finitions premium.

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.2.0.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.2.0/krys-audition-v1.2.0.apk)**
          files: |
            krys-audition-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
