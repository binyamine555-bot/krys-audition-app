name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Krys Audition – Mon Parcours Auditif (v1.0.3 - Simulateur Sonore, Passeport Médical & Gamification)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.3 Enrichie & Sécurisée)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            L'évaluation du prototype est protégée par un code d'accès :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### ✨ Nouvelles Fonctionnalités Majeures (v1.0.3) :
            1. **Simulateur d'Environnements Sonores Krys (Immersion Réelle) :**
               - 4 ambiances sonores calibrées : *Restaurant & Déjeuner animé* (effet cocktail party), *Boulevard & Circulation*, *Cuisine & Vaisselle* (chocs impulsionnels), *Salon & Ventilation continue*.
               - Lecteur interactif avec égaliseur animé en direct.
               - Sélecteur de difficulté RSB (+15 dB, +10 dB, +5 dB, 0 dB).
               - Test de compréhension de phrase directement dans l'ambiance avec révélation masquée.
               - Explications techniques sur les algorithmes Krys Audition (microphones directionnels, anti-choc, réducteur de bruit binaural).
            2. **Passeport d'Adaptation Auditive & Bilan Clinique Krys :**
               - Attestation officielle pour le Médecin ORL et l'audioprothésiste.
               - Synthèse audiométrique (BIAP, SII vocal, SRT, RSB-50).
               - Mesure objective de l'observance (séances, temps cumulé, série d'assiduité, précision phonétique).
               - Fonction d'exportation / impression PDF directe (`window.print()`).
            3. **Badges d'Assiduité & Récompenses Krys (Gamification) :**
               - 8 étapes clés valorisées pour motiver le patient tout au long de ses 120 premiers jours.
            4. **Synergie Krys Optique & Audition :**
               - Guide confort pour porter lunettes et appareils contours sans frottement.
               - Privilège réseau : 1 contrôle visuel + auditif annuel offert.
            5. **Mode Démonstration 1-Clic :**
               - Bouton direct pour charger en 1 seconde un dossier patient complet type (Monique Durand) pour vos présentations en réunion ou en centre.

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.3.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.3/krys-audition-v1.0.3.apk)**
          files: |
            krys-audition-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
