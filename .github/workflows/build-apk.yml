name: Build Android APK (Krys Audition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Android Project with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk krys-audition-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krys-Audition-APK
          path: krys-audition-v1.0.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Krys Audition – Mon Parcours Auditif (v1.0.5 - Répertoire National 560+ Centres & Espaces)"
          body: |
            ### 📱 Application Mobile Android – Krys Audition (Version 1.0.5 - Réseau National Exhaustif)
            **Projet porté par Benjamin Joseph COHEN**, Audioprothésiste D.E. Cnam Paris.

            #### 🔒 Code d'accès confidentiel :
            - **Code à saisir dans l'application :** `KRYS2026`

            #### 📍 Répertoire exhaustif de plus de 560 Centres & Espaces en France :
            - **Couverture nationale intégrale :** Plus de 560 centres et espaces Krys Audition répertoriés dans toute la France métropolitaine et d'outre-mer (Guadeloupe, Martinique, Guyane, La Réunion).
            - **Centres Exclusifs & Espaces Audition :** 283 centres exclusifs d'audiologie avec cabines insonorisées de dernière génération et 283 espaces audition intégrés en synergie Optique & Audition.
            - **Recherche instantanée :** Recherche fluide par code postal, ville, département ou région.
            - **Fiche dédiée Benjamin Joseph COHEN :** Audioprothésiste référent D.E. Cnam Paris au centre Paris 11e Bastille.

            #### 🔊 Moteur acoustique & Clarté Vocale HD :
            - Étalonnage parole/bruit de fond optimisé avec ducking acoustique automatique pour un confort d'entraînement parfait.

            #### 📥 Téléchargement direct :
            - **[Télécharger krys-audition-v1.0.5.apk](https://github.com/binyamine555-bot/krys-audition-app/releases/download/v1.0.5/krys-audition-v1.0.5.apk)**
          files: |
            krys-audition-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
