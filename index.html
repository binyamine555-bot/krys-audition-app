<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Krys Audition – Mon Parcours Auditif</title>
  <meta name="description" content="Application d'entraînement auditif personnalisé et de suivi pour les patients appareillés Krys Audition.">
  <meta name="theme-color" content="#002D62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23002D62'/><path d='M10 11a6 6 0 1 1 12 0c0 5-6 6.5-6 9.5a3 3 0 1 1-6 0' fill='none' stroke='%23E2001A' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Barre Supérieure de l'Application -->
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <a href="#/home" class="brand-link">
        <span class="brand-k">KRYS</span>
        <span class="brand-a">AUDITION</span>
      </a>
      <div class="header-right">
        <a href="#/centers" class="header-icon-btn" title="Centres Krys en France" aria-label="Centres">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </a>
        <a href="#/calibration" class="header-icon-btn" title="Étalonnage" aria-label="Étalonnage">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
        </a>
        <a href="#/profile" class="header-icon-btn" title="Mon Profil" aria-label="Profil">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Contenu Principal Injecté Dynamiquement -->
  <main id="app" class="app-main"></main>

  <!-- Barre de Navigation Inférieure Mobile -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Navigation principale"></nav>

  <!-- Chargement des Modules JavaScript dans l'ordre de dépendances -->
  <script src="js/data.js"></script>
  <script src="js/centers.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/calibration.js"></script>
  <script src="js/clinical.js"></script>
  <script src="js/audiogram.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/training.js"></script>
  <script src="js/views.js"></script>
  <script src="js/pro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
